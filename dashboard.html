<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - GeoFlix</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
  <a href="/" class="back-btn">← Back to Home</a>
  <button id="logoutBtn" class="logout-btn">Logout</button>

  <div id="loading" class="loading">
    <h2>Loading your dashboard...</h2>
  </div>

  <div id="dashboard" style="display: none;">
    <header class="header">
      <h1>Welcome, <span id="userName"></span></h1>
    </header>

    <div class="dashboard-container">
      <div class="points-rank">
        <div>Points: <span id="points"></span></div>
        <div>Rank: <span id="rank"></span></div>
        <a href="lb.html" class="btn-main">View Leaderboard</a>
      </div>
      <button onclick="window.location.href='media.html'" class="btn-main">Take a Picture</button>
      <button onclick="window.location.href='tree.html'" class="btn-main">Go to Tree</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let authToken = localStorage.getItem('authToken');

    // Check authentication
    if (!authToken) {
      window.location.href = '/';
    }

    // Elements
    const loading = document.getElementById('loading');
    const dashboard = document.getElementById('dashboard');
    const userName = document.getElementById('userName');
    const points = document.getElementById('points');
    const rank = document.getElementById('rank');
    const logoutBtn = document.getElementById('logoutBtn');

    // Load user profile
    async function loadProfile() {
      try {
        const response = await fetch('/api/profile', {
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });

        if (!response.ok) {
          throw new Error('Failed to load profile');
        }

        const profile = await response.json();
        currentUser = profile;
        displayDashboard();
      } catch (error) {
        console.error('Error loading profile:', error);
        localStorage.removeItem('authToken');
        window.location.href = '/';
      }
    }

    function displayDashboard() {
      loading.style.display = 'none';
      dashboard.style.display = 'block';

      // Update user info
      userName.textContent = currentUser.name;
      points.textContent = currentUser.points;
      rank.textContent = currentUser.rank;
    }

    // Logout
    logoutBtn.onclick = () => {
      localStorage.removeItem('authToken');
      window.location.href = '/';
    };

    // Initialize
    loadProfile();
  </script>
</body>
</html>
