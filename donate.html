<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate to GeoFlix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 400px; margin: auto; }
        input, textarea { width: 100%; padding: 8px; margin: 10px 0; }
        button { padding: 10px; margin: 5px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>Donate to GeoFlix</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="You can leave this empty" required>

        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" placeholder="0.00" min="0.01" step="0.01" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Message"></textarea>

        <h3>Payment Methods</h3>
        <button type="button">Pay with PayPal</button>
        <button type="button">Pay with Stripe</button>
        <button type="button">Pay with Credit Card</button>
    </form>
</body>
</html>
<style>
    form { border: 2px solid #ccc; border-radius: 10px; padding: 20px; }
</style>
<img src="sapling-placeholder.png" alt="Small sapling growing on coins" style="display: block; margin: 20px auto; width: 100px;">
